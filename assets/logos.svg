<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="abyssGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03045e" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="earthCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#ae2012" />
    </linearGradient>

    <!-- === SPRITE 1: ICONO ABBYS (Fosa Abisal / Océano) === -->
    <symbol id="icon-abbys" viewBox="0 0 200 200">
      <!-- Contenedor circular con fondo oscuro integrado -->
      <circle cx="100" cy="100" r="95" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
      <circle cx="100" cy="100" r="62" fill="url(#abyssGrad)" />
      
      <!-- Líneas batimétricas -->
      <path d="M55,115 C75,135 125,135 145,115" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M70,100 C85,112 115,112 130,100" fill="none" stroke="#90e0ef" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M85,85 C92,92 108,92 115,85" fill="none" stroke="#caf0f8" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Fosa en V central -->
      <path d="M75,60 L100,90 L125,60" fill="none" stroke="url(#oceanGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>

    <!-- === SPRITE 2: ICONO MUNDO INTERNO (Capas de la Tierra) === -->
    <symbol id="icon-mundo-interno" viewBox="0 0 200 200">
      <!-- Contenedor circular con fondo oscuro integrado -->
      <circle cx="100" cy="100" r="95" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      
      <!-- Capas de la Tierra -->
      <circle cx="100" cy="100" r="75" fill="#21262d" stroke="#30363d" stroke-width="4"/>
      <circle cx="100" cy="100" r="58" fill="#9a3412" />
      <circle cx="100" cy="100" r="38" fill="#ea580c" />
      <circle cx="100" cy="100" r="18" fill="url(#earthCore)" />
      
      <!-- Cuña de corte transversal -->
      <path d="M100,100 L175,100 A75,75 0 0,0 153,47 Z" fill="#38bdf8" opacity="0.15" />
      <path d="M100,100 L175,100" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,2"/>
      <path d="M100,100 L100,25" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,2"/>
    </symbol>
  </defs>

  <!-- Fondo general de la vista previa -->
  <rect width="460" height="220" fill="#0d1117" />

  <!-- Previsualización de los iconos -->
  <g transform="translate(10, 10)">
    <use href="#icon-abbys" width="200" height="200" />
  </g>

  <g transform="translate(250, 10)">
    <use href="#icon-mundo-interno" width="200" height="200" />
  </g>
</svg>
